name: Build LaTeX Diff PDF

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch, tag, or commit to compare against"
        required: true
        default: "main"

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed version from pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: new
          fetch-depth: 0

      - name: Checkout base version from pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          fetch-depth: 0

      - name: Checkout proposed version from selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: new
          fetch-depth: 0

      - name: Checkout base version from input
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: old
          fetch-depth: 0

      - name: Install latexdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff

      - name: Show compared revisions
        run: |
          echo "Base revision:"
          git -C old rev-parse --short HEAD
          echo "Proposed revision:"
          git -C new rev-parse --short HEAD
          echo "Changed files:"
          git -C new diff --name-status "$(git -C old rev-parse HEAD)" "$(git -C new rev-parse HEAD)" || true

      - name: Create flattened diff source
        run: |
          latexdiff --flatten --type=CFONT old/main.tex new/main.tex > new/main-diff.tex

      - name: Compile diff PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: new
          root_file: main-diff.tex
          latexmk_use_lualatex: true
          latexmk_shell_escape: false

      - name: Upload diff PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-diff-pdf
          path: new/main-diff.pdf

      - name: Upload diff source on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-diff-debug-source
          path: |
            new/main-diff.tex
            new/main-diff.log
