name: Build LaTeX Diff PDF

on:
  pull_request:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed version
        uses: actions/checkout@v4
        with:
          path: new
          fetch-depth: 0

      - name: Checkout base version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          fetch-depth: 0

      - name: Install latexdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff

      - name: Create flattened diff source
        run: |
          latexdiff --flatten old/main.tex new/main.tex > new/main-diff.tex

      - name: Compile diff PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: new
          root_file: main-diff.tex
          latexmk_use_lualatex: true
          latexmk_shell_escape: false

      - name: Upload diff PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-diff-pdf
          path: new/main-diff.pdf

      - name: Upload diff source on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-diff-debug-source
          path: |
            new/main-diff.tex
            new/main-diff.log
